plugins { id 'com.android.application' }

android {
    namespace 'dev.spaghettikart.phone'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.spaghettikart.phone'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-cockpit'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DUSE_OPENGLES=ON', '-DANDROID_STL=c++_shared',
                    '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
                    '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'Spaghettify', 'SDL2'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.6'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging false } }
}
